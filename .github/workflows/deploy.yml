# Builds cv.pdf from the LaTeX source in X0X0X00/Resume and deploys the site to GitHub Pages.
#
# Triggers:
#   - push to main            (site content changed)
#   - hourly schedule         (picks up Overleaf -> GitHub pushes in X0X0X00/Resume; skips if nothing changed)
#   - manual "Run workflow"   (or: gh workflow run deploy.yml)
#
# cv.pdf committed in this repo is only a fallback; the deployed one is always rebuilt from the resume repo.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RESUME_REPO: X0X0X00/Resume
  RESUME_TEX: Zhenhao_cv_EN.tex
  TECTONIC_VERSION: 0.17.0
  SITE_URL: https://x0x0x00.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out resume source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESUME_REPO }}
          path: resume

      - name: Skip scheduled run if the resume has not changed
        id: check
        run: |
          sha=$(git -C resume rev-parse HEAD)
          live=$(curl -fsSL "$SITE_URL/cv.sha" || echo none)
          echo "resume HEAD: $sha  /  deployed: $live"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$sha" = "$live" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Resume unchanged — nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$sha" > cv.sha

      - name: Restore cached tectonic
        if: steps.check.outputs.changed == 'true'
        id: tectonic-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-x86_64-unknown-linux-musl

      - name: Install tectonic
        # GitHub release downloads occasionally return 5xx for a few minutes: retry with
        # backoff, and let the CV step fall back to the published PDF if it still fails.
        if: steps.check.outputs.changed == 'true' && steps.tectonic-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fSL --retry 10 --retry-delay 20 --retry-all-errors -o "$RUNNER_TEMP/tectonic.tar.gz" "$url"
          mkdir -p ~/.local/bin
          tar xzf "$RUNNER_TEMP/tectonic.tar.gz" -C ~/.local/bin tectonic
          ~/.local/bin/tectonic --version

      - name: Compile CV
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ -x ~/.local/bin/tectonic ]; then
            mkdir -p out
            ~/.local/bin/tectonic -o out "resume/${RESUME_TEX}"
            cp "out/${RESUME_TEX%.tex}.pdf" cv.pdf
          elif curl -fsSL -o cv.live.pdf "$SITE_URL/cv.pdf"; then
            # Keep the currently published CV and its cv.sha, so the hourly run recompiles
            # as soon as tectonic can be downloaded again.
            echo "::warning::tectonic unavailable; keeping the currently published cv.pdf"
            mv cv.live.pdf cv.pdf
            curl -fsSL -o cv.sha "$SITE_URL/cv.sha" || echo none > cv.sha
          else
            echo "::warning::tectonic unavailable and no published CV; using the committed cv.pdf"
            echo none > cv.sha
          fi
          ls -l cv.pdf

      - name: Assemble site
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'resume' --exclude 'out' --exclude '_site' ./ _site/
          ls -la _site

      - name: Configure Pages
        if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
